<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation Salon de Coiffure</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2c3e50; }
    .coiffeurs-grid { display: flex; gap: 10px; margin-bottom: 15px; }
    .card { border: 2px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; flex: 1; }
    .card.selected { border-color: #27ae60; background-color: #e8f8f5; }
    .card img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #27ae60; color: white; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; }
    button:hover { background: #219150; }
    .msg { margin-top: 15px; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center; }
    .error { background: #f8d7da; color: #721c24; }
    .success { background: #d4edda; color: #155724; }
  </style>
</head>
<body>

<div class="container">
  <h2>Prendre Rendez-vous</h2>
  
  <label>1. Choisissez votre coiffeur :</label>
  <div class="coiffeurs-grid" id="coiffeursGrid"></div>

  <label for="date">2. Date :</label>
  <input type="date" id="date" onchange="actualiserHeures()">

  <label for="heure">3. Heure :</label>
  <select id="heure">
    <option value="">-- Sélectionnez d'abord une date --</option>
  </select>

  <label for="client">4. Nom du Client :</label>
  <input type="text" id="client" placeholder="Votre nom complet">

  <button onclick="validerReservation()">Confirmer la réservation</button>

  <div id="message"></div>
</div>

<script>
  // Données des coiffeurs avec images
  const coiffeurs = [
    { id: 1, nom: "Karim", photo: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=300&q=80" },
    { id: 2, nom: "Sami", photo: "https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&w=300&q=80" }
  ];

  // Base de données fictive des créneaux déjà occupés
  const reservationsExistantes = [
    { coiffeurId: 1, date: "2026-08-25", heure: "10:00" },
    { coiffeurId: 1, date: "2026-08-25", heure: "14:00" },
    { coiffeurId: 2, date: "2026-08-25", heure: "11:00" }
  ];

  const creneauxDisponibles = ["09:00", "10:00", "11:00", "14:00", "15:00", "16:00", "17:00"];
  let coiffeurSelectionne = null;

  // Afficher les cartes coiffeurs avec photos
  function afficherCoiffeurs() {
    const grid = document.getElementById("coiffeursGrid");
    grid.innerHTML = "";
    coiffeurs.forEach(c => {
      grid.innerHTML += `
        <div class="card" id="card-${c.id}" onclick="selectionnerCoiffeur(${c.id})">
          <img src="${c.photo}" alt="${c.nom}">
          <h4>${c.nom}</h4>
        </div>
      `;
    });
  }

  function selectionnerCoiffeur(id) {
    coiffeurSelectionne = id;
    document.querySelectorAll(".card").forEach(el => el.classList.remove("selected"));
    document.getElementById(`card-${id}`).classList.add("selected");
    actualiserHeures();
  }

  // Mettre à jour la liste des heures disponibles sans afficher les créneaux pris
  function actualiserHeures() {
    const dateInput = document.getElementById("date").value;
    const heureSelect = document.getElementById("heure");
    heureSelect.innerHTML = "";

    if (!coiffeurSelectionne) {
      heureSelect.innerHTML = '<option value="">-- Choisissez un coiffeur d\'abord --</option>';
      return;
    }

    if (!dateInput) {
      heureSelect.innerHTML = '<option value="">-- Sélectionnez une date --</option>';
      return;
    }

    // Filtrer les heures libres pour ce coiffeur précis à cette date
    const heuresLibres = creneauxDisponibles.filter(heure => {
      const dejaPris = reservationsExistantes.some(r => 
        r.coiffeurId === coiffeurSelectionne && 
        r.date === dateInput && 
        r.heure === heure
      );
      return !dejaPris;
    });

    if (heuresLibres.length === 0) {
      heureSelect.innerHTML = '<option value="">Aucun créneau disponible pour cette date</option>';
    } else {
      heuresLibres.forEach(heure => {
        heureSelect.innerHTML += `<option value="${heure}">${heure}</option>`;
      });
    }
  }

  // Validation et enregistrement du rendez-vous
  function validerReservation() {
    const date = document.getElementById("date").value;
    const heure = document.getElementById("heure").value;
    const client = document.getElementById("client").value.trim();
    const msgDiv = document.getElementById("message");

    if (!coiffeurSelectionne || !date || !heure || !client) {
      msgDiv.className = "msg error";
      msgDiv.textContent = "Veuillez remplir tous les champs.";
      return;
    }

    // Double vérification de la disponibilité
    const dejaOccupe = reservationsExistantes.some(r => 
      r.coiffeurId === coiffeurSelectionne && r.date === date && r.heure === heure
    );

    if (dejaOccupe) {
      msgDiv.className = "msg error";
      msgDiv.textContent = "Ce créneau vient juste d'être réservé, choisissez une autre heure.";
      return;
    }

    // Ajout à la base locale
    reservationsExistantes.push({ coiffeurId: coiffeurSelectionne, date, heure, client });
    
    msgDiv.className = "msg success";
    msgDiv.textContent = `Réservation confirmée pour ${client} à ${heure} le ${date} !`;
    
    actualiserHeures(); // Mise à jour dynamique des créneaux
  }

  // Initialisation au chargement de la page
  afficherCoiffeurs();
</script>

</body>
</html>
